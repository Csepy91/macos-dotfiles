# Cinematic Noir — Starship
# Palette tokens mirror ~/.config/theme/colors.env

format = """
$directory$git_branch$git_status$cmd_duration
$character
"""

palette = "cinematic_noir"

[palettes.cinematic_noir]
fg = "#D0D2DF"
muted = "#6D7291"
blue = "#6672B8"
blue_bright = "#6F78C4"
purple = "#8B68B5"
amber = "#B07855"
green = "#668B78"
red = "#A76565"
yellow = "#B09A69"
bg = "#0D0D13"
surface = "#161720"
border = "#30344B"

[character]
success_symbol = "[❯](blue)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](purple)"

[directory]
style = "fg"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
modified = "!"
staged = "+"
untracked = "?"
deleted = "✘"
renamed = "»"
stashed = "≡"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[cmd_duration]
min_time = 2000
style = "muted"
format = "[$duration]($style) "
