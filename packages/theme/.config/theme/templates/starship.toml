# Generated by theme apply — palette {{THEME_NAME}}

format = """
$directory$git_branch$git_status$cmd_duration
$character
"""

palette = "dotfiles"

[palettes.dotfiles]
fg = "{{FG}}"
muted = "{{MUTED}}"
blue = "{{BLUE}}"
blue_bright = "{{BLUE_BRIGHT}}"
purple = "{{PURPLE}}"
amber = "{{AMBER}}"
green = "{{GREEN}}"
red = "{{RED}}"
yellow = "{{YELLOW}}"
bg = "{{BASE}}"
surface = "{{SURFACE}}"
border = "{{THEME_BORDER}}"

[character]
success_symbol = "[❯](blue)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](purple)"

[directory]
style = "fg"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
modified = "!"
staged = "+"
untracked = "?"
deleted = "✘"
renamed = "»"
stashed = "≡"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[cmd_duration]
min_time = 2000
style = "muted"
format = "[$duration]($style) "
