# Generated by theme apply — palette {{THEME_NAME}}

[mgr]
cwd = { fg = "{{BLUE_BRIGHT}}" }

find_keyword = { fg = "{{AMBER}}", bold = true }
find_position = { fg = "{{PURPLE}}", bg = "reset", bold = true }

marker_copied = { fg = "{{GREEN}}", bg = "{{GREEN}}" }
marker_cut = { fg = "{{RED}}", bg = "{{RED}}" }
marker_marked = { fg = "{{AMBER}}", bg = "{{AMBER}}" }
marker_selected = { fg = "{{BLUE_BRIGHT}}", bg = "{{BLUE_BRIGHT}}" }

count_copied = { fg = "{{BASE}}", bg = "{{GREEN}}" }
count_cut = { fg = "{{BASE}}", bg = "{{RED}}" }
count_selected = { fg = "{{BASE}}", bg = "{{BLUE_BRIGHT}}" }

border_symbol = "│"
border_style = { fg = "{{THEME_BORDER}}" }

[indicator]
current = { fg = "{{FG}}", bg = "{{THEME_BORDER}}" }
preview = { fg = "{{FG}}", bg = "{{SURFACE}}" }

[tabs]
active = { fg = "{{BASE}}", bg = "{{BLUE_BRIGHT}}" }
inactive = { fg = "{{MUTED}}", bg = "{{SURFACE}}" }

[mode]
normal_main = { fg = "{{BASE}}", bg = "{{BLUE}}", bold = true }
normal_alt = { fg = "{{BLUE}}", bg = "{{SURFACE_ALT}}" }
select_main = { fg = "{{BASE}}", bg = "{{BLUE_BRIGHT}}", bold = true }
select_alt = { fg = "{{BLUE_BRIGHT}}", bg = "{{SURFACE_ALT}}" }
unset_main = { fg = "{{BASE}}", bg = "{{AMBER}}", bold = true }
unset_alt = { fg = "{{AMBER}}", bg = "{{SURFACE_ALT}}" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "{{FG}}", bg = "{{SURFACE}}" }
perm_type = { fg = "{{BLUE_BRIGHT}}" }
perm_read = { fg = "{{GREEN}}" }
perm_write = { fg = "{{YELLOW}}" }
perm_exec = { fg = "{{RED}}" }
perm_sep = { fg = "{{MUTED}}" }
progress_label = { fg = "{{FG}}", bold = true }
progress_normal = { fg = "{{BLUE}}", bg = "{{BASE}}" }
progress_error = { fg = "{{RED}}", bg = "{{BASE}}" }

[pick]
border = { fg = "{{BLUE}}" }
active = { fg = "{{BLUE_BRIGHT}}", bold = true }
inactive = { fg = "{{FG}}" }

[input]
border = { fg = "{{BLUE}}" }
title = { fg = "{{FG}}" }
value = { fg = "{{FG}}" }
selected = { bg = "{{THEME_BORDER}}" }

[cmp]
border = { fg = "{{BLUE}}" }
active = { fg = "{{FG}}", bg = "{{THEME_BORDER}}" }
inactive = { fg = "{{MUTED}}" }

[tasks]
border = { fg = "{{BLUE}}" }
title = { fg = "{{FG}}" }
hovered = { fg = "{{FG}}", bg = "{{THEME_BORDER}}" }

[which]
mask = { bg = "{{SURFACE}}" }
cand = { fg = "{{BLUE_BRIGHT}}" }
rest = { fg = "{{MUTED}}" }
desc = { fg = "{{PURPLE}}" }
separator = " ─ "
separator_style = { fg = "{{THEME_BORDER}}" }

[help]
border = { fg = "{{BLUE}}" }
chord = { fg = "{{BLUE_BRIGHT}}" }
action = { fg = "{{PURPLE}}" }
hovered = { fg = "{{FG}}", bg = "{{THEME_BORDER}}", bold = true }

[notify]
title_info = { fg = "{{BLUE}}" }
title_warn = { fg = "{{AMBER}}" }
title_error = { fg = "{{RED}}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{PURPLE}}" },
  { mime = "video/*", fg = "{{MAGENTA}}" },
  { mime = "audio/*", fg = "{{CYAN}}" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{YELLOW}}" },
  { mime = "application/{pdf,doc,rtf}", fg = "{{AMBER}}" },
  { url = "*/", fg = "{{BLUE_BRIGHT}}" },
  { url = "*", fg = "{{FG}}" },
]
